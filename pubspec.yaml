name: mentos
description: "Peer-to-peer, anonymous social and messaging. Your data lives on your device."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  sqlite3: ^3.7.0
  path_provider: ^2.1.6
  path: ^1.9.1
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  record: ^7.1.1
  just_audio: ^0.10.6
  video_player: ^2.14.1
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  uuid: ^4.6.0
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  intl: ^0.20.3
  permission_handler: ^13.0.2
  open_filex: ^4.7.0
  collection: ^1.19.1
  crypto: ^3.0.7
  bip39: ^1.0.6
  ffi: ^2.1.4
  local_auth: ^3.0.2
  flutter_local_notifications: ^22.3.2
  url_launcher: ^6.3.3
  flutter_pcm_sound: ^3.3.3
  camera: ^0.12.1
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/logo.jpg
  min_sdk_android: 26
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/logo/logo.jpg
  web:
    generate: true
    image_path: assets/logo/logo.jpg
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: assets/logo/logo.jpg
    icon_size: 256
  macos:
    generate: true
    image_path: assets/logo/logo.jpg

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/geist-400.ttf
          weight: 400
        - asset: assets/fonts/geist-500.ttf
          weight: 500
        - asset: assets/fonts/geist-600.ttf
          weight: 600
        - asset: assets/fonts/geist-700.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/geist-mono-400.ttf
          weight: 400
        - asset: assets/fonts/geist-mono-500.ttf
          weight: 500
