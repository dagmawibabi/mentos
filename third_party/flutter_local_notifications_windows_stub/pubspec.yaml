# Dart-only stand-in for flutter_local_notifications_windows.
# The real plugin compiles C++ that includes <atlbase.h>, which Visual Studio
# Build Tools does not ship unless the ATL component is installed. Mentos does
# not show OS notifications on Windows (NotificationService.supported).
name: flutter_local_notifications_windows
description: No-op Windows implementation of flutter_local_notifications.
version: 3.1.1
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications_platform_interface: ^12.0.0
  timezone: ^0.11.0

flutter:
  plugin:
    implements: flutter_local_notifications
    platforms:
      windows:
        dartPluginClass: FlutterLocalNotificationsWindows
