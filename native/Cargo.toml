[package]
name = "mentos_net"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
hex = "0.4"
iroh = { version = "1.3", features = ["unstable-net-report"] }
iroh-gossip = "0.101"
n0-future = "0.3"
serde_json = "1"
sha2 = "0.10"
url = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[profile.release]
# Fat LTO + 1 codegen unit OOMs a 16 GB Windows box during link.
lto = "thin"
codegen-units = 8
panic = "unwind"
